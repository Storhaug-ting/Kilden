name: Verifiser kilder

# Hver kilde skal stemme med originalen: den lokale kopien mot registrert
# sjekksum, og markdown-filen mot det konverteringen faktisk produserer.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verifisering:
    name: Kildene er i samsvar med originalen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Hent repoet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sett opp Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Installer pdfplumber
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pdfplumber

      # Samme skript som brukes lokalt, slik at det bare finnes én definisjon av
      # hva «i samsvar» betyr. Frakoblet, siden en utgiver som legger ut en ny
      # utgave ikke skal gjøre en urørt pull request rød.
      - name: Kontroller mot sjekksum og konvertering
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Update-Source.ps1' -Frakoblet
