name: Verify sources

# Two checks, and they answer different questions. One measures that a source
# still matches the original the publisher put out. The other measures that the
# links inside it lead somewhere. A source can pass the first and fail the
# second: a generated table of contents can reproduce every word correctly and
# still point at nothing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  sources:
    name: Sources match the original
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pdfplumber
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pdfplumber

      # The same script that runs locally, so there is only one definition of
      # what "matches" means. Offline, because a publisher releasing a new
      # edition should not turn an untouched pull request red.
      - name: Check against the checksum and the conversion
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Update-Source.ps1' -Frakoblet

  links:
    name: Links and anchors resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pwsh is on the runner image already, so this check needs no toolchain.
      - name: Check links and anchors
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Test-MarkdownLink.ps1'
