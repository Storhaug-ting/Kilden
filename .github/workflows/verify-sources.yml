name: Verify sources

# Four checks, and they answer different questions. One measures that a
# static source still matches the original the publisher put out. Another
# measures the same thing for the law texts, which have no static original to
# match against — only the snapshot checked in here. The third measures that
# the links inside a source lead somewhere. A source can pass all three and
# still fail: a generated table of contents can reproduce every word
# correctly and still point at nothing, and a check reporting success over
# nothing looks exactly like one that worked — the fourth proves the link
# check can still tell the difference.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  sources:
    name: Sources match the original
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pdfplumber
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pdfplumber

      # The same script that runs locally, so there is only one definition of
      # what "matches" means. Offline, because a publisher releasing a new
      # edition should not turn an untouched pull request red.
      - name: Check against the checksum and the conversion
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Update-Source.ps1' -Frakoblet

  lovtekster:
    name: Lovtekster match Lovdata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Python toolchain here: the law texts convert from XML that is
      # already semantic, so there is no PDF-conversion step to install for.
      # Offline for the same reason as the job above — Lovdata ajourfører the
      # dataset every night, and that should not turn an untouched pull
      # request red.
      - name: Check against the checked-in snapshot and the conversion
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Update-Lovtekst.ps1' -Frakoblet

  links:
    name: Links and anchors resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pwsh is on the runner image already, so this check needs no toolchain.
      - name: Check links and anchors
        shell: pwsh
        run: pwsh -NoProfile -File 'scripts/Test-MarkdownLink.ps1'

  # Its own job, so the name of the red check says which of the four failed.
  tests:
    name: The link check can still fail
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pester is pinned to an exact version, because a workflow is an end
      # artifact rather than a library: a new release must not turn an untouched
      # pull request red. Keep it inside the range the suites' '#Requires' lines
      # declare. The GUID is Pester's own, so a different module of the same
      # name on the runner cannot satisfy the pin.
      - name: Run the Pester suites
        id: pester
        uses: PSModule/Invoke-Pester@4ff33199141fdf22568990b6107fe3148ae93a1c # v5.1.0
        with:
          Path: ./tests
          Version: 6.0.1
          Guid: a699dea5-2c73-4616-a270-1f7abb777e71

      # Pester throws when it finds no test file at all, so an empty 'tests' is
      # already red. A suite that holds no test is not: Pester returns Passed
      # with a total of nothing, and the run is green having proved nothing -
      # the same vacuous pass this check exists to catch. The guard also fails
      # when no count arrives, because the count is an output of the pinned
      # action above and a bump that renamed it must not read as a pass. It is
      # passed through the environment rather than expanded into the command,
      # so a value can never become code.
      - name: Fail when the run proved nothing
        shell: pwsh
        env:
          TOTAL_COUNT: ${{ steps.pester.outputs.TotalCount }}
        run: ./scripts/Assert-TestCount.ps1 -TotalCount $env:TOTAL_COUNT
